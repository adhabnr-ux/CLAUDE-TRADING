name: Bull — Aggressive 🔥

# Manual backup runner. Primary Claude Code schedules are configured externally.
on:
  workflow_dispatch:
    inputs:
      routine:
        description: 'Which AGGRO routine to run'
        required: true
        type: choice
        options:
          - aggro-premarket
          - aggro-market-open
          - aggro-midday
          - aggro-close
          - aggro-weekly-review

permissions:
  contents: write

# Shared with the Cautious workflow: queue all paper-trading runs so memory and
# broker reconciliation cannot race one another.
concurrency:
  group: bull-paper-trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Make scripts executable
        run: chmod +x scripts/alpaca.sh scripts/notify.sh

      - name: Configure git identity
        run: |
          git config user.email "aggro-bull-bot@users.noreply.github.com"
          git config user.name "Aggro Bull Bot"

      - name: Run AGGRO Bull routine
        run: python3 runner.py "${{ inputs.routine }}"
        env:
          PYTHONUNBUFFERED:       '1'
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL:            ${{ vars.GROQ_MODEL }}
          ALPACA_API_KEY_ID:     ${{ secrets.ALPACA_API_KEY_ID_AGGRO }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY_AGGRO }}
          ALPACA_EXPECTED_ACCOUNT_ID: ${{ secrets.ALPACA_EXPECTED_ACCOUNT_ID_AGGRO }}
          ALPACA_BASE_URL:       https://paper-api.alpaca.markets
          TRADING_AGENT:         aggro
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
